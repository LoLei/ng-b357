<div class="pricing">
  <h1>💰 Pricing Plans</h1>
  <p>Choose the best plan for your needs and enjoy exclusive benefits! 🌟</p>
  <div class="plans">
    <ng-template ngFor let-plan [ngForOf]="pricingPlans" [ngForTrackBy]="trackByIndex">
      <div class="plan">
        <h2>{{ plan.tier }} 🚀</h2>
        <p class="price">
          {{ plan.price }}
        </p>
        <ul>
          <ng-template ngFor let-feature [ngForOf]="plan.features" [ngForTrackBy]="trackByFeature">
            <li>✅ {{ feature }}</li>
          </ng-template>
        </ul>
        <button type="button" class="subscribe-button">Subscribe Now</button>
      </div>
    </ng-template>
  </div>
</div>
